    "question": "下列哪一個國家同時是小麥、玉米及水稻的世界前三大出口國？",
    "options": {
      "A": "泰國",
      "B": "澳洲",
      "C": "美國",
      "D": "中國大陸"
    },
    "answer": "送分",
    "explanation": "本題因沒有單一國家同時為小麥、玉米與水稻前三大出口國（泰國主出口水稻、美國主出口玉米/小麥等），故官方列為送分題。"
  },
  {
    "id": 96,
    "question": "中國因檢出臺灣出口之鳳梨有介殼蟲而禁止輸入，臺灣政府可向哪一個機構提出仲裁？",
    "options": {
      "A": "世界農糧組織 ( FAO )",
      "B": "世界衛生組織 ( WHO )",
      "C": "世界貿易組織 ( WTO )",
      "D": "亞太經濟合作組織 ( APEC )"
    },
    "answer": "C",
    "explanation": "涉及國際貿易爭端與檢疫限制時，會員國可向世界貿易組織（WTO）之爭端解決機制提出申訴或仲裁。"
  }
];

    // State Variables
    let selectedQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let userAnswers = []; // Stores object for wrong questions
    let questionCountSetting = 'all';

    // UI Elements
    const setupScreen = document.getElementById('setup-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');

    const questionText = document.getElementById('question-text');
    const questionIdBadge = document.getElementById('question-id-badge');
    const optionsContainer = document.getElementById('options-container');
    const feedbackBox = document.getElementById('feedback-box');
    const feedbackTitle = document.getElementById('feedback-title');
    const explanationText = document.getElementById('explanation-text');
    const toggleExpBtn = document.getElementById('toggle-exp-btn');
    const nextBtn = document.getElementById('next-btn');

    const progressText = document.getElementById('progress-text');
    const progressBar = document.getElementById('progress-bar');
    const currentScoreText = document.getElementById('current-score-text');

    // Update Question Count Selection Style
    function setQuestionCount(count) {
      questionCountSetting = count;
      document.querySelectorAll('.count-btn').forEach(btn => {
        btn.classList.remove('border-emerald-600', 'bg-emerald-50', 'text-emerald-700');
        btn.classList.add('border-slate-200', 'text-slate-700');
      });
      const activeBtn = document.getElementById(`count-${count}`);
      if (activeBtn) {
        activeBtn.classList.remove('border-slate-200', 'text-slate-700');
        activeBtn.classList.add('border-emerald-600', 'bg-emerald-50', 'text-emerald-700');
      }
    }

    // Update Mode Radio Style
    function updateModeStyle() {
      const isRandom = document.querySelector('input[name="selection-mode"]:checked').value === 'random';
      const randomLabel = document.getElementById('mode-random-label');
      const seqLabel = document.getElementById('mode-sequential-label');

      if (isRandom) {
        randomLabel.className = "flex items-center gap-3 p-4 border-2 rounded-xl cursor-pointer hover:bg-slate-50 border-emerald-500 bg-emerald-50/30";
        seqLabel.className = "flex items-center gap-3 p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50";
      } else {
        seqLabel.className = "flex items-center gap-3 p-4 border-2 rounded-xl cursor-pointer hover:bg-slate-50 border-emerald-500 bg-emerald-50/30";
        randomLabel.className = "flex items-center gap-3 p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50";
      }
    }

    // Shuffle Array Utility
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Start Quiz
    function startQuiz() {
      const mode = document.querySelector('input[name="selection-mode"]:checked').value;
      let list = [...questionsData];

      if (mode === 'random') {
        list = shuffleArray(list);
      } else {
        list.sort((a, b) => a.id - b.id);
      }

      const totalAvail = list.length;
      let countToPick = totalAvail;
      if (questionCountSetting !== 'all') {
        countToPick = Math.min(parseInt(questionCountSetting), totalAvail);
      }

      selectedQuestions = list.slice(0, countToPick);
      currentIndex = 0;
      score = 0;
      userAnswers = [];

      setupScreen.classList.add('hidden');
      resultScreen.classList.add('hidden');
      quizScreen.classList.remove('hidden');

      renderQuestion();
    }

    // Render Question
    function renderQuestion() {
      const q = selectedQuestions[currentIndex];
      questionIdBadge.textContent = `第 ${q.id} 題`;
      questionText.textContent = q.question;

      // Reset Feedback Box
      feedbackBox.classList.add('hidden');
      explanationText.classList.add('hidden');
      toggleExpBtn.textContent = '💡 查看試題解析';

      // Reset Next Button
      nextBtn.disabled = true;
      nextBtn.className = "bg-slate-300 text-slate-500 font-bold px-8 py-3 rounded-xl transition cursor-not-allowed";
      nextBtn.textContent = currentIndex === selectedQuestions.length - 1 ? "提交結算結果 🏁" : "下一題 ➔";

      // Render Progress
      progressText.textContent = `進度：第 ${currentIndex + 1} / ${selectedQuestions.length} 題`;
      const progressPercent = ((currentIndex) / selectedQuestions.length) * 100;
      progressBar.style.width = `${progressPercent}%`;

      // Calculate Current Score out of 100
      const currentScoreCalculated = Math.round((score / selectedQuestions.length) * 100);
      currentScoreText.textContent = `當前得分：${currentScoreCalculated} 分`;

      // Render Options
      optionsContainer.innerHTML = '';
      Object.entries(q.options).forEach(([key, val]) => {
        const btn = document.createElement('button');
        btn.className = "option-btn text-left p-4 rounded-xl border-2 border-slate-200 hover:border-emerald-500 hover:bg-emerald-50/50 transition font-medium flex items-start gap-3 bg-white";
        btn.onclick = () => checkAnswer(key, btn);
        btn.innerHTML = `
          <span class="bg-slate-100 text-slate-700 font-bold px-2.5 py-1 rounded-lg text-sm">${key}</span>
          <span class="flex-1 mt-0.5">${val}</span>
        `;
        optionsContainer.appendChild(btn);
      });
    }

    // Check Selected Answer
    function checkAnswer(selectedKey, clickedBtn) {
      const q = selectedQuestions[currentIndex];
      const isCorrect = selectedKey === q.answer || q.answer === '送分';

      // Disable all option buttons
      const allBtns = optionsContainer.querySelectorAll('button');
      allBtns.forEach(btn => {
        btn.disabled = true;
        btn.classList.remove('hover:border-emerald-500', 'hover:bg-emerald-50/50');
      });

      // Highlight options
      allBtns.forEach(btn => {
        const optionKey = btn.querySelector('span').textContent.trim();
        if (optionKey === q.answer) {
          btn.classList.add('border-emerald-500', 'bg-emerald-100', 'text-emerald-900', 'font-bold');
        }
      });

      if (isCorrect) {
        score++;
        feedbackBox.className = "p-4 rounded-xl border border-emerald-300 bg-emerald-50 space-y-3";
        feedbackTitle.className = "font-bold text-lg flex items-center gap-2 text-emerald-800";
        feedbackTitle.innerHTML = `✅ 答對了！`;
      } else {
        clickedBtn.classList.add('border-red-500', 'bg-red-100', 'text-red-900');
        feedbackBox.className = "p-4 rounded-xl border border-red-300 bg-red-50 space-y-3";
        feedbackTitle.className = "font-bold text-lg flex items-center gap-2 text-red-800";
        feedbackTitle.innerHTML = `❌ 答錯了！正確答案是 (${q.answer})`;

        // Save to Wrong Questions List
        userAnswers.push({
          question: q,
          userChoice: selectedKey
        });
      }

      // Fill Explanation text
      explanationText.innerHTML = `<strong>解析說明：</strong> ${q.explanation}`;
      feedbackBox.classList.remove('hidden');

      // Enable Next Button
      nextBtn.disabled = false;
      nextBtn.className = "bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3 rounded-xl transition shadow-lg hover:shadow-xl cursor-pointer";
    }

    // Toggle Explanation
    function toggleExplanation() {
      const isHidden = explanationText.classList.contains('hidden');
      if (isHidden) {
        explanationText.classList.remove('hidden');
        toggleExpBtn.textContent = '🙈 隱藏試題解析';
      } else {
        explanationText.classList.add('hidden');
        toggleExpBtn.textContent = '💡 查看試題解析';
      }
    }

    // Next Question
    function nextQuestion() {
      if (currentIndex < selectedQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        showResults();
      }
    }

    // Show Results & 錯題大鍋菜
    function showResults() {
      quizScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');

      const totalQuestions = selectedQuestions.length;
      const finalScoreCalculated = Math.round((score / totalQuestions) * 100);
      const wrongCount = userAnswers.length;

      document.getElementById('final-score').textContent = finalScoreCalculated;
      document.getElementById('score-summary-text').textContent =
        `總題數：${totalQuestions} 題 | 答對：${score} 題 | 答錯：${wrongCount} 題 | 正確率：${Math.round((score/totalQuestions)*100)}%`;

      document.getElementById('wrong-count-badge').textContent = `共 ${wrongCount} 題`;

      const wrongListContainer = document.getElementById('wrong-questions-list');
      wrongListContainer.innerHTML = '';

      if (wrongCount === 0) {
        wrongListContainer.innerHTML = `
          <div class="text-center py-10 bg-slate-50 rounded-xl border border-dashed border-slate-300">
            <p class="text-emerald-600 font-bold text-lg">🎉 恭喜您！本次測驗完全沒有錯題！</p>
            <p class="text-slate-500 text-sm mt-1">您對《農業概論第2章農業環境與發展》的概念掌握度非常優異！</p>
          </div>
        `;
      } else {
        userAnswers.forEach((item, index) => {
          const q = item.question;
          const card = document.createElement('div');
          card.className = "bg-white border border-red-200 rounded-xl p-5 shadow-sm space-y-3";
          card.innerHTML = `
            <div class="flex items-start gap-2">
              <span class="bg-red-600 text-white text-xs font-bold px-2 py-0.5 rounded mt-0.5">錯題 ${index + 1}</span>
              <h4 class="font-bold text-slate-800 text-base">[原題號 第 ${q.id} 題] ${q.question}</h4>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm bg-slate-50 p-3 rounded-lg border border-slate-100">
              <div class="text-red-600 font-bold">❌ 您的作答：(${item.userChoice}) ${q.options[item.userChoice] || '未選擇'}</div>
              <div class="text-emerald-700 font-bold">✅ 正確答案：(${q.answer}) ${q.options[q.answer] || ''}</div>
            </div>

            <div class="bg-amber-50/60 border border-amber-200/80 rounded-lg p-3 text-xs md:text-sm text-slate-700 leading-relaxed">
              <span class="font-bold text-amber-800">📖 試題解析 (依據課本內容)：</span>
              <p class="mt-1">${q.explanation}</p>
            </div>
          `;
          wrongListContainer.appendChild(card);
        });
      }
    }

    // Restart Quiz
    function restartQuiz() {
      resultScreen.classList.add('hidden');
      setupScreen.classList.remove('hidden');
    }
  </script>
</body>
</html>
